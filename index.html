<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مافیا آنلاین (۸، ۱۰ و ۱۲ نفره)</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body {
      margin: 0;
      background: #0b1120;
      color: #f8fafc;
      padding: 12px;
    }
    .card {
      background: #162033;
      border: 1px solid #293855;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
    }
    h2, h3 { margin: 0 0 10px 0; font-size: 15px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 12.5px;
      cursor: pointer;
    }
    button.green { background: #16a34a; }
    button.red { background: #dc2626; }
    button.amber { background: #d97706; }
    button.purple { background: #7c3aed; }
    button.teal { background: #0d9488; }
    button.gray { background: #475569; }
    input, select {
      background: #0b1120;
      color: #fff;
      border: 1px solid #3b4d70;
      border-radius: 10px;
      padding: 9px;
      font-size: 13px;
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .player-box {
      background: #0b1120;
      border: 1px solid #293855;
      border-radius: 10px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.5;
    }
    .player-box.dead { opacity: 0.45; text-decoration: line-through; }
    .role-badge {
      background: #312e81;
      color: #e0e7ff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
    }
    .mod-note {
      background: #0b1120;
      border-right: 3px solid #a78bfa;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #ddd6fe;
      margin-top: 8px;
    }
    .voice-box {
      background: #0b1120;
      border: 1px solid #1e3a5f;
      border-radius: 10px;
      padding: 10px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
    }
    .voice-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #132036;
      padding: 6px 8px;
      border-radius: 8px;
      margin-top: 6px;
    }
    #chatBox {
      height: 185px;
      overflow-y: auto;
      background: #0b1120;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .msg { margin-bottom: 6px; line-height: 1.55; }
    .msg.system { color: #fbbf24; font-weight: bold; }
    .msg.mafia-chat { color: #f87171; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="userInfo">در حال اتصال به تلگرام...</div>
  </div>

  <div id="homeSection" class="card">
    <h3>ساخت یا ورود به اتاق مافیا</h3>
    <div class="row" style="margin-bottom: 10px;">
      <select id="targetSizeSelect">
        <option value="8">میز ۸ نفره</option>
        <option value="10">میز ۱۰ نفره</option>
        <option value="12">میز ۱۲ نفره</option>
      </select>
      <button class="green" id="createRoomBtn" style="flex: 1;">ساخت اتاق جدید</button>
    </div>
    <div class="row">
      <input id="roomCodeInput" placeholder="کد اتاق (مثلاً MAF123)" style="flex: 1;" />
      <button id="joinRoomBtn">ورود</button>
    </div>
  </div>

  <div id="roomSection" class="hidden">
    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <div>کد: <strong id="roomCodeText">-</strong></div>
        <div>راند: <strong id="roundText">0</strong></div>
        <div>وضعیت: <strong id="roomStatusText">-</strong></div>
        <div>تایمر: <strong id="timerText">--:--</strong></div>
      </div>

      <div id="myRoleBox" class="hidden">
        <div class="role-badge" id="myRoleText"></div>
      </div>

      <div id="moderatorPanel" class="mod-note hidden"></div>

      <div class="row" style="margin-top: 10px;">
        <button class="purple hidden" id="becomeModBtn">من گرداننده (مجری) می‌شوم</button>
        <button class="amber hidden" id="addBotsBtn">پر کردن بات تستی</button>
        <button class="green hidden" id="startGameBtn">شروع بازی</button>
        <button class="red hidden" id="startVoteBtn">شروع رای‌گیری</button>
        <button class="amber hidden" id="botsVoteBtn">رای خودکار بات‌ها</button>
        <button class="gray hidden" id="finishVoteBtn">پایان رای‌گیری و شب</button>
        <button class="amber hidden" id="botsNightBtn">اکشن خودکار بات‌ها</button>
        <button class="green hidden" id="resolveNightBtn">صبح شدن</button>
        <button class="gray" id="leaveRoomBtn">خروج</button>
      </div>

      <!-- بخش ویس کوتاه / پیام صوتی داخل مینی‌اپ -->
      <div class="voice-box">
        <div class="row" style="justify-content: space-between;">
          <strong>🎙️ ویس کوتاه داخل بازی</strong>
          <div class="row">
            <button class="teal" id="recordVoiceBtn">ضبط ویس</button>
            <button class="red hidden" id="stopVoiceBtn">توقف و ارسال</button>
          </div>
        </div>
        <div style="color: #94a3b8; margin-top: 4px;">
          برای گفتگوی طولانی یا گروهی راحت‌تر، می‌تونید هم‌زمان از <strong>ویس‌چت خودِ گروه تلگرام</strong> هم استفاده کنید.
        </div>
        <div id="voiceList"></div>
      </div>
    </div>

    <div id="voteSection" class="card hidden">
      <h3>رای‌گیری روز</h3>
      <div class="row">
        <select id="voteTargetSelect" style="flex: 1;"></select>
        <button class="red" id="castVoteBtn">ثبت رای</button>
      </div>
    </div>

    <div id="nightSection" class="card hidden">
      <h3>اکشن شب</h3>
      <div class="row">
        <select id="nightTargetSelect" style="flex: 1;"></select>
        <button id="nightActionBtn">ثبت هدف</button>
      </div>
      <div id="inquiryResult" style="margin-top: 8px; color: #38bdf8; font-size: 13px;"></div>
    </div>

    <div class="card">
      <h3>بازیکن‌ها (<span id="playerCount">0</span>/<span id="maxPlayerCount">8</span>)</h3>
      <div id="playersList" class="players-grid"></div>
    </div>

    <div class="card">
      <h3>چت اتاق</h3>
      <div id="chatBox"></div>
      <div class="row">
        <select id="chatChannelSelect">
          <option value="public">عمومی</option>
          <option value="mafia_night">شب مافیا</option>
        </select>
        <input id="chatInput" placeholder="پیام بنویس..." style="flex: 1;" />
        <button id="sendMsgBtn">ارسال</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
