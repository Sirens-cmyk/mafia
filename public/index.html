<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مافیا آنلاین</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: Tahoma, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
    }
    h2, h3 { margin: 0 0 10px 0; font-size: 16px; }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.green { background: #16a34a; }
    button.gray { background: #475569; }
    input {
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
    }
    .row { display: flex; gap: 8px; align-items: center; }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .player-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 8px;
      font-size: 13px;
    }
    .role-badge {
      background: #312e81;
      color: #e0e7ff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      display: inline-block;
      margin-top: 6px;
    }
    #chatBox {
      height: 200px;
      overflow-y: auto;
      background: #0f172a;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 13px;
    }
    .msg { margin-bottom: 6px; line-height: 1.5; }
    .msg.system { color: #fbbf24; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div id="userInfo">در حال اتصال به تلگرام...</div>
  </div>

  <!-- بخش ورود یا ساخت اتاق -->
  <div id="homeSection" class="card">
    <h3>ساخت یا ورود به اتاق مافیا</h3>
    <div class="row" style="margin-bottom: 10px;">
      <button class="green" id="createRoomBtn" style="flex: 1;">ساخت اتاق جدید</button>
    </div>
    <div class="row">
      <input id="roomCodeInput" placeholder="کد اتاق (مثلاً MAF123)" style="flex: 1;" />
      <button id="joinRoomBtn">ورود</button>
    </div>
  </div>

  <!-- بخش داخل اتاق -->
  <div id="roomSection" class="hidden">
    <div class="card">
      <div class="row" style="justify-content: space-between;">
        <div>کد اتاق: <strong id="roomCodeText">-</strong></div>
        <div>وضعیت: <strong id="roomStatusText">-</strong></div>
        <div>تایمر: <strong id="timerText">--:--</strong></div>
      </div>
      <div id="myRoleBox" class="hidden">
        <div class="role-badge" id="myRoleText"></div>
      </div>
      <div style="margin-top: 10px;">
        <button class="green hidden" id="startGameBtn">شروع بازی (۸ نفر)</button>
        <button class="gray" id="leaveRoomBtn">خروج از اتاق</button>
      </div>
    </div>

    <div class="card">
      <h3>بازیکن‌ها (<span id="playerCount">0</span>/8)</h3>
      <div id="playersList" class="players-grid"></div>
    </div>

    <div class="card">
      <h3>چت اتاق</h3>
      <div id="chatBox"></div>
      <div class="row">
        <input id="chatInput" placeholder="پیام بنویس..." style="flex: 1;" />
        <button id="sendMsgBtn">ارسال</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
